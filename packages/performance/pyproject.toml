# Standalone performance analysis tools. Not a uv workspace member: it has its own uv.lock and
# does not depend on the rest of the repository.

[project]
name = "weathergen-performance"
version = "0.1.0"
description = "Performance analysis tools for WeatherGenerator"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "polars~=1.25.2",
    "pandas~=2.2",
    "matplotlib",
    "pyarrow>=23.0.1",
]

[project.scripts]
extract_scaling_data = "weathergen.performance.extract_scaling_data:main"
generate_scaling_plots = "weathergen.performance.generate_scaling_plots:main"

[dependency-groups]
dev = [
 "pytest>=8.3",
 "ruff==0.12.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weathergen"]


# The linting configuration
[tool.ruff]

# Wide rows
line-length = 100

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # Naming conventions
    "N",
    # print
    "T201"
]

[tool.ruff.format]
# Use Unix `\n` line endings for all files
line-ending = "lf"
