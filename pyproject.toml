[project]
name = "weathergen"
version = "0.1.0"
description = "The WeatherGenerator Machine Learning Earth System Model"
readme = "README.md"
authors = [
    { name = "WeatherGenerator collaboration" }
]

requires-python = ">=3.12,<3.13"
# TODO: split the plotting dependencies into their own dep groups, they are not required.
dependencies = [
 'numpy~=2.2',
 'astropy_healpix~=1.1.2',
 'zarr~=3.1.3',
 'pandas~=2.2',
 'tqdm',
 'matplotlib',
 'packaging',
 'wheel',
 'psutil',
 "polars~=1.25.2",
 "omegaconf~=2.3.0",
 "dask~=2025.5.1",
 "hatchling",
 "numexpr>=2.11.0",
 "anemoi-datasets",
 "weathergen-common",
 "weathergen-evaluate",
 "weathergen-readers-extra",
 "ninja>=1.13.0",
 "torch-c-dlpack-ext>=0.1.5",
 "einops>=0.8.2",
 "apache-tvm-ffi==0.1.10",
]


[project.urls]
Homepage = "https://www.weathergenerator.eu"
Documentation = "https://readthedocs.org"
Repository = "https://github.com/ecmwf/WeatherGenerator.git"
Issues = "https://github.com/ecmwf/WeatherGenerator/issues"

[project.scripts]
train = "weathergen.run_train:train"
train_continue = "weathergen.run_train:train_continue"
inference = "weathergen.run_train:inference"
evaluate = "weathergen.evaluate.run_evaluation:evaluate"
plot_train = "weathergen.utils.plot_training:plot_train"
export = "weathergen.evaluate.export.export_inference:export"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/weathergen"]

[dependency-groups]
# The development dependencies
dev = [
 "ipykernel>=6.30.0",
 "jupytext>=1.17.2",
 "pytest>=8.3",
 "pytest-mock>=3.14.1",
 "ruff==0.9.7",
 "tensorboard>=2.20.0",
 "pdbpp>=0.11.7",
 "pylint==4.0.3",
 "pyrefly==0.36.0",
]


# Torch listed as optional dependencies.
# uv and python can only filter dependencies by platform, not by capability.
# Following the recommendations from https://docs.astral.sh/uv/guides/integration/pytorch
# We need to support:
# x86_64: cpu (unit tests) + gpu 
# aarch64: gpu
[project.optional-dependencies]

cpu = [
  'torch==2.6.0',
]

gpu = [
  "torch==2.6.0; sys_platform == 'linux'",
  # flash-attn also has a torch dependency.
  "flash-attn-4; sys_platform == 'linux'",
]


[tool.black]

# Wide rows
line-length = 100


# The linting configuration
[tool.ruff]

# Wide rows
line-length = 100

[tool.ruff.lint]
# All disabled until the code is formatted.
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
    # Banned imports
    "TID",
    # Naming conventions
    "N",
    # print
    "T201"
]

# These rules are sensible and should be enabled at a later stage.
ignore = [
  # "B006",
  "B011",
  "UP008",
  "SIM117",
  "SIM118",
  "SIM102",
  "SIM401",
  # To ignore, not relevant for us
  "SIM108", # in case additional norm layer supports are added in future
  "N817", # we use heavy acronyms, e.g., allowing 'import LongModuleName as LMN' (LMN is accepted)
  "E731", # overly restrictive and less readable code
  "N812", # prevents us following the convention for importing torch.nn.functional as F
]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"numpy.ndarray".msg = "Do not use 'ndarray' to describe a numpy array type, it is a function. Use numpy.typing.NDArray or numpy.typing.NDArray[np.float32] for example"

[tool.ruff.format]
# Use Unix `\n` line endings for all files
line-ending = "lf"

# Some useful warnings are not yet in ruff

[tool.pylint.main]
ignore = ["tests", ".venv", ".git", ".tox", ".ruff_cache"]
load-plugins = ["pylint.extensions.bad_builtin"]

[tool.pylint.bad_builtins]
bad-functions = ["getattr", "setattr"]

[tool.pylint.messages_control]
disable = ["all"]
enable = ["W0201", "W0141"]


[tool.uv]
# Most work is done a distributed filesystem, where hardlink is not always possible.
# Also, trying to resolve some permissions issue, see 44.
link-mode = "symlink"
# This guarantees that the build is deterministic and will not be impacted
# by future releases of dependencies or sub-dependencies.
# See https://docs.astral.sh/uv/reference/settings/#exclude-newer
# TODO: pytorch does not publish valid release timestamps, so sadly it does not work.
exclude-newer = "2026-04-10T00:00:00Z"
# flash-attn-4 depends on nvidia-cutlass-dsl>=4.4.2 which only has pre-release versions.
prerelease = "if-necessary"

# The minimum version of uv required.
# It is tightly controlled because the format of uv.lock has changed 
# over revisions, causing reformats to happen without reason.
# Also, relatively recent versions are required to support workspaces.
required-version = ">=0.7.0"

# The supported environments
# TODO: add macos and windows (CPU only, for running tests)
environments = [
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
]

# One can only have cpu or gpu.
conflicts = [
  [
    { extra = "cpu" },
    { extra = "gpu" },
  ],
]


[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true


[tool.pyrefly]
project-includes = ["src/"]
project-excludes = [
]

[tool.pyrefly.errors]
bad-argument-type = false
unsupported-operation = false
missing-attribute = false
no-matching-overload = false
bad-context-manager = false

# To do:
bad-assignment = false
bad-return = false
index-error = false
not-iterable = false
not-callable = false



[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
weathergen-common = { workspace = true }
weathergen-evaluate = { workspace = true }
weathergen-metrics = { workspace = true }
weathergen-readers-extra = { workspace = true }


flash-attn-4 = [
# flash-attn 4 ships as a pure-Python wheel (py3-none-any); CUDA kernels are loaded at runtime.
# The same wheel works on both aarch64 and x86_64.
  { url = "https://github.com/Dao-AILab/flash-attention/releases/download/fa4-v4.0.0.beta6/flash_attn_4-4.0.0b5-py3-none-any.whl", marker = "sys_platform == 'linux'" },
  # There is no official support for flash-attn on macos
]

# Pin to 0.1.4 to avoid 0.1.5 which pulls in CUDA 13 packages incompatible with our CUDA 12 HPC.
torch-c-dlpack-ext = [
  { url = "https://files.pythonhosted.org/packages/35/c0/0ae9067fd9f15f1feacfd7398314aa48f922ddb9cbeb5f95c8a2e1831cb8/torch_c_dlpack_ext-0.1.4-cp312-cp312-manylinux_2_24_x86_64.manylinux_2_28_x86_64.whl", marker = "sys_platform == 'linux' and platform_machine == 'x86_64'" },
  { url = "https://files.pythonhosted.org/packages/5f/4c/7d59344006807613baca1daf3109ea6a81743146330b5afde96dc953115c/torch_c_dlpack_ext-0.1.4-cp312-cp312-manylinux_2_24_aarch64.manylinux_2_28_aarch64.whl", marker = "sys_platform == 'linux' and platform_machine == 'aarch64'" },
  { url = "https://files.pythonhosted.org/packages/84/c8/97c3d4a1c05dd41e4ba70a8abff47a93951c035a3db1a532777b372f63bc/torch_c_dlpack_ext-0.1.4-cp312-cp312-macosx_14_0_arm64.whl", marker = "sys_platform == 'darwin' and platform_machine == 'arm64'" },
]


torch = [
# On Linux, always use the cu126 GPU wheel regardless of extra (cpu or gpu).
# This avoids conflicts when transitive deps (e.g. torch-c-dlpack-ext via flash-attn-4) pull in torch
# outside of an extra context, which would otherwise resolve to torch 2.11+CUDA13 from PyPI.
# The GPU wheel works fine for CPU-only usage (unit tests), at the cost of a larger download.
  { url = "https://download.pytorch.org/whl/cu126/torch-2.6.0%2Bcu126-cp312-cp312-linux_aarch64.whl", marker = 'sys_platform == "linux" and platform_machine == "aarch64"' },
  { url = "https://download.pytorch.org/whl/cu126/torch-2.6.0%2Bcu126-cp312-cp312-manylinux_2_28_x86_64.whl", marker = 'sys_platform == "linux" and platform_machine == "x86_64"' },
# macOS: CPU only.
  { url = "https://download.pytorch.org/whl/cpu/torch-2.6.0-cp312-none-macosx_11_0_arm64.whl", marker = "sys_platform == 'darwin'" },
]
# branch = "feature/any-zarr-version-in-pyproject/"
anemoi-datasets = { git = "https://github.com/tjhunter/anemoi-datasets", tag = "0.0.1"}

[tool.pytest.ini_options]
log_cli = true
log_cli_level = "INFO"
log_cli_format = "%(asctime)s [%(levelname)8s] %(message)s (%(filename)s:%(lineno)s)"
log_cli_date_format = "%Y-%m-%d %H:%M:%S"


[tool.uv.workspace]
members = [
   "packages/common",
   "packages/evaluate",
   "packages/metrics",
   "packages/readers_extra",
# Explicitly not depending on 'packages/dashboard' : this causes issues when deploying
# the streamlit dashboard.
]

