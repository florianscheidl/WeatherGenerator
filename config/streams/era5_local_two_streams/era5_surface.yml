# A second stream from the same local dataset (surface variables), so that runs on one machine
# exercise the multi-stream code paths. Used by config/era5_local_forecasting.yml.
ERA5_surface:
  type: anemoi
  stream_id: 1
  filenames: ["era5-o96-2020-1pct-6h-v1.zarr"]
  loss_weight: 1.
  source: ["2t", "msl", "10u", "10v"]
  target: ["2t", "msl"]
  diagnostic: False
  masking_rate: 0.6
  masking_rate_none: 0.05
  token_size: 32
  tokenize_spacetime: True
  max_num_targets: -1
  embed:
    net: transformer
    num_tokens: 1
    num_heads: 2
    dim_embed: 16
    num_blocks: 2
  embed_target_coords:
    net: linear
    dim_embed: 16
  target_readout:
    num_layers: 2
    num_heads: 2
  pred_head:
    ens_size: 1
    num_layers: 1
