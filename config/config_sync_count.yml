# Count the host-device syncs of a few training steps per call site, then end the run
# (weathergen.utils.sync_counter). Counting slows the steps down; do not time this run.
# The report is <run dir>/profiling_traces/<timestamp>_rank_<rank>_sync_count.json.

profiling:
  enabled: True
  stop_after_profiling: True
  wait_iteration: 1
  warmup_iteration: 1
  active_iteration: 3
  repeat: 1
  sync_count:
    enabled: True
