# Eight consecutive ranks share one batch. Every level-1 HEALPix parent and all
# of its descendant stream tokens remain on exactly one rank through embedding
# and local assimilation.
encoder_spatial_parallel_size: 8
encoder_spatial_parallel_parent_level: 1
