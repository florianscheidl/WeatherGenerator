# Wall-clock time per phase of the run (weathergen.utils.phase_timer): setup, the waits for
# the data loader, the training loop, validation, checkpoints, logging. Synchronizes the
# device only at logging, validation and checkpoints, never per training step. Do not combine
# with the profiling collectors when timing.
# The report is <run dir>/phase_timing_rank<rank>.json, written at process exit.

performance_logging:
  phase_timing:
    enabled: True
